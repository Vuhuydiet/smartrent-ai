name: CD

# Continuous Deployment — runs only after code is merged to main/dev.
# Builds + pushes the image to DockerHub, then triggers a Dokploy redeploy via
# its per-app deploy webhook (Dokploy pulls the new image and recreates the
# container). No SSH, no tags.env bump — Dokploy owns the deploy + shows
# logs/health in its UI.
#
# Gating: merges to main/dev go through PRs, and CI (ci.yml) is a required
# check, so by the time code lands here it has already passed lint + tests.
#
# Required secrets:
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN  — push image
#   DOKPLOY_AI_WEBHOOK                   — Dokploy deploy webhook URL for the `ai` app
#                                          (https://deploy.thuenhatro.net/api/deploy/<token>)

on:
  push:
    branches: [ main, dev ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        # The Dokploy `ai` app pulls `:dev`; keep that tag moving + a unique
        # SHA tag for traceability/rollback.
        tags: |
          vuhuydiet/smartrent-ai:${{ github.sha }}
          vuhuydiet/smartrent-ai:dev
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Trigger Dokploy redeploy
      run: |
        curl -fsSL -X POST "${{ secrets.DOKPLOY_AI_WEBHOOK }}"
        echo "Dokploy redeploy triggered for ai."

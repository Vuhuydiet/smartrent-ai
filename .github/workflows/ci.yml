name: CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

env:
  DOCKER_IMAGE_NAME: smartrent-ai
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: uv sync

    - name: Run code quality checks
      run: |
        # Format check
        uv run black --check .

        # Import sorting check
        uv run isort --check-only .

        # Linting
        uv run flake8 .

        # Type checking
        uv run mypy .

  test:
    runs-on: ubuntu-latest
    needs: lint

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: uv sync

    - name: Run unit tests
      run: |
        uv run pytest tests/ -v --cov=app --cov-report=xml:tests/coverage.xml --cov-report=html:tests/htmlcov --cov-fail-under=1

    - name: Check coverage threshold
      run: |
        uv run coverage report --fail-under=1
        echo "✅ Coverage is above the minimum threshold of 1%"

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      if: success()
      with:
        file: ./tests/coverage.xml
        flags: unittests
        name: codecov-umbrella

  build-and-push:
    needs: [ lint, test ]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          vuhuydiet/smartrent-ai:${{ github.sha }}
          vuhuydiet/smartrent-ai:dev
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')

    steps:
      - name: Checkout Deployment Repository
        uses: actions/checkout@v4
        with:
          repository: 'Vuhuydiet/smartrent-deploy'
          token: ${{ secrets.DEPLOY_REPO_TOKEN }}
          path: 'smartrent-deploy'

      - name: Update AI image tag
        run: |
          sed -i 's/^AI_TAG=.*/AI_TAG=${{ github.sha }}/' smartrent-deploy/docker/tags.env

      - name: Commit and push changes
        working-directory: smartrent-deploy
        # Pass values via env, not inline ${{ }} substitution. When the
        # head commit message contains double quotes, parentheses, or
        # Vietnamese text, inlining it into `git commit -m "..."` breaks
        # bash arg parsing and git interprets the fragments as pathspecs.
        # Reading from a file via `git commit -F` sidesteps all shell
        # quoting issues — the message goes to disk verbatim.
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_LINK: https://github.com/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docker/tags.env

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          {
            printf 'Deploy AI: '
            printf '%s' "$HEAD_COMMIT_MESSAGE"
            printf '\n\n%s\n' "$COMMIT_LINK"
          } > /tmp/deploy-commit-msg.txt

          git commit -F /tmp/deploy-commit-msg.txt
          git push

      - name: Deploy to Droplet
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            cd ~/smartrent-deploy
            git fetch origin main
            git reset --hard origin/main
            docker compose \
              --env-file docker/.env \
              --env-file docker/tags.env \
              -f docker/docker-compose.yml \
              pull ai
            docker compose \
              --env-file docker/.env \
              --env-file docker/tags.env \
              -f docker/docker-compose.yml \
              up -d --no-deps ai

            # ---- Image retention (best-effort, never fails the deploy) ----
            # Without this the Droplet accumulates one ~2.4GB image per push
            # because each build is tagged with the commit SHA and never
            # overwritten. `docker rmi` on the currently-running image fails
            # with "image is being used" — that's the safety net.
            set +e
            REPO="vuhuydiet/smartrent-ai"
            KEEP=5
            docker container prune -f
            docker images "$REPO" --format '{{.Tag}} {{.CreatedAt}}' \
              | grep -Ev '^(dev|prd|prod|main|latest) ' \
              | grep -v '^<none>' \
              | sort -k2,2 -r \
              | tail -n +$((KEEP + 1)) \
              | awk '{print $1}' \
              | while read -r tag; do
                  docker rmi "${REPO}:${tag}" 2>/dev/null || true
                done
            docker image prune -f
            docker builder prune -f --keep-storage 2GB
            docker system df

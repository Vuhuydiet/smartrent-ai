name: CI

# Continuous Integration — the merge gate.
# Runs lint + tests on every PR into main/dev. Build + deploy live in cd.yml
# and run only AFTER code is merged. Enable branch protection so this check
# must pass before a PR can merge → main/dev only ever contain tested code.

on:
  pull_request:
    branches: [ main, dev ]

env:
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: uv sync

    - name: Run code quality checks
      run: |
        uv run black --check .
        uv run isort --check-only .
        uv run flake8 .
        uv run mypy .

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: uv sync

    - name: Run unit tests
      run: |
        uv run pytest tests/ -v --cov=app --cov-report=xml:tests/coverage.xml --cov-report=html:tests/htmlcov --cov-fail-under=1

    - name: Check coverage threshold
      run: |
        uv run coverage report --fail-under=1
        echo "✅ Coverage is above the minimum threshold of 1%"

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      if: success()
      with:
        file: ./tests/coverage.xml
        flags: unittests
        name: codecov-umbrella
